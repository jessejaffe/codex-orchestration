- Limitations: <limitations or None>

## Completed

<concise recommendation-led outcome, exact target state, evidence, and any material caveat>

## Next step
- Action: <one specific imperative action; never None>
- Why: <why this is the highest-leverage next move>
- Success: <observable proof that it worked>

## Route
- Class: <friendly class from CLASSIFICATION>
- Implementation: <IMPLEMENTATION_ROUTE>
- Supervision: None
- Root: <CURRENT_ROOT_ROUTE>
"""
