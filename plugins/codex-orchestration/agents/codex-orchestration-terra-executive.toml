working service-local query or application API over repairing unrelated infrastructure.
Acceptance must never mutate state, including actions reserved for later user approval.
TAKEOVER only if the acceptance claim remains unverified after those paths are exhausted.
Tests, hashes, source equality, HTTP 200, and server/config validation
alone do not prove user-visible behavior. In-app Browser backends are isolated from child
threads. For frontend work, root supplies `ROOT_VISUAL_EVIDENCE` captured from the actual
